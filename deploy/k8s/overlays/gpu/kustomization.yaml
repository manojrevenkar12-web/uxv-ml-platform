# GPU cluster: the train step requests GPUs (one rank per GPU via torchrun,
# NCCL backend is picked automatically), lands on GPU nodes and tolerates
# their taint; everything else stays on CPU nodes. Rendered and linted in CI,
# but not executed there (CI has no GPUs).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: {kind: WorkflowTemplate, name: uxv-perception}
    patch: |-
      - op: replace
        path: /spec/arguments/parameters/0/value
        value: registry.example.com/uxvml:gpu
      - op: replace
        path: /spec/arguments/parameters/6/value
        value: "4"
      - op: add
        path: /spec/templates/4/nodeSelector
        value: {nvidia.com/gpu.present: "true"}
      - op: add
        path: /spec/templates/4/tolerations
        value: [{key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}]
      - op: replace
        path: /spec/templates/4/container/resources
        value: {requests: {cpu: "16", memory: 64Gi, nvidia.com/gpu: "4"}, limits: {memory: 96Gi, nvidia.com/gpu: "4"}}
