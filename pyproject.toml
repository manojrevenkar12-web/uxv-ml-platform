[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uxvml"
version = "0.1.0"
description = "ML platform for multimodal UxV sensor data: ingestion, QC, versioned shards, distributed training, validation gates, auto-labelling and dataset search"
authors = [{ name = "Manoj Kumar Prakash" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "pyarrow>=15",
    "pandas>=2.1",
    "pyyaml>=6",
    "pydantic>=2.5",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "mlflow>=2.12",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
uxvml = "uxvml.cli:main"

[tool.setuptools.packages.find]
include = ["uxvml*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]
